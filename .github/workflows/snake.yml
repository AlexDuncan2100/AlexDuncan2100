name: Contribution snake

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg?palette=github-light&color_snake=#FF9900&color_dots=#ebedf0,#9ecbff,#54aeff,#0969da,#0078d4
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=#FF9900&color_dots=#161b22,#0b3a63,#0e5a9c,#1f7fd1,#4493f8
      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
